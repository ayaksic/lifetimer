name: Deploy Life Timer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - name: Assemble website
        run: |
          mkdir _site
          cp \
            Web/index.html \
            Web/site.webmanifest \
            Web/apple-touch-icon-180.png \
            Web/apple-touch-icon.png \
            Web/icon-1024.png \
            Web/icon-192.png \
            Web/icon-512.png \
            Web/hope.mp3 \
            Web/nonsense.wav \
            Web/life-timer-core.js \
            Web/cloudkit-config.js \
            Web/cloudkit-settings.js \
            _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
