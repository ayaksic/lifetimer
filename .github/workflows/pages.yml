name: Deploy Life Timer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - name: Assemble website
        run: |
          mkdir _site
          cp \
            index.html \
            site.webmanifest \
            apple-touch-icon-180.png \
            apple-touch-icon.png \
            icon-1024.png \
            icon-192.png \
            icon-512.png \
            hope.mp3 \
            nonsense.wav \
            life-timer-core.js \
            cloudkit-config.js \
            cloudkit-settings.js \
            _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4