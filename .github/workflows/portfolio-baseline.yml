name: Life Timer verification

# Advisory verification is opt-in; the Pages deployment remains automatic.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up patched Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Report Xcode toolchain
        run: xcodebuild -version

      - name: Verify complete consolidated repository
        run: ./scripts/verify-all.sh
