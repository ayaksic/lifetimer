<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#fbf8f3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Life Timer">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Life Timer">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
    <link rel="icon" sizes="192x192" href="icon-192.png">
    <link rel="icon" sizes="512x512" href="icon-512.png">
    <title>Life Timer</title>
    <style>
      :root {
        color-scheme: light;
        --elapsed: #b66a5f;
        --remaining: #fbf8f3;
        --live: #d7ff2f;
        --ink: #161312;
        --muted: rgba(22, 19, 18, 0.62);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--remaining);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
      }

      .readout {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        pointer-events: none;
      }

      .center {
        width: min(92vw, 900px);
        text-align: center;
        text-wrap: balance;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.64),
          0 0 18px rgba(255, 255, 255, 0.72);
        transform: translateY(var(--readout-offset, 0px));
        transition: transform 160ms ease-out;
      }

      .period {
        display: block;
        margin-bottom: 0.65rem;
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: clamp(0.78rem, 2.7vw, 1rem);
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .percent {
        display: block;
        font-size: clamp(1.6rem, 8.5vw, 5.4rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <canvas id="progress" aria-hidden="true"></canvas>
    <audio id="hope-audio" src="hope.mp3" preload="auto"></audio>
    <main class="readout" aria-live="off">
      <div class="center">
        <span class="period" id="period">Hour</span>
        <span class="percent" id="percent">0.0000000000%</span>
      </div>
    </main>

    <script>
      const canvas = document.getElementById("progress");
      const context = canvas.getContext("2d", { alpha: false });
      const periodElement = document.getElementById("period");
      const percentElement = document.getElementById("percent");
      const centerElement = document.querySelector(".center");
      const hopeAudio = document.getElementById("hope-audio");
      const colors = {
        elapsed: "#b66a5f",
        remaining: "#fbf8f3",
        live: "#d7ff2f",
        liveOutline: "#161312",
        grid: "rgba(22, 19, 18, 0.18)",
        gridLabel: "rgba(22, 19, 18, 0.42)",
      };

      const pageDefinitions = [
        {
          label: "Hour",
          period: "hour",
          range(now) {
            return {
              start: new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours()),
              end: new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours() + 1),
            };
          },
        },
        {
          label: "Today",
          period: "day",
          range(now) {
            return {
              start: new Date(now.getFullYear(), now.getMonth(), now.getDate()),
              end: new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1),
            };
          },
        },
        {
          label: "This Week",
          period: "week",
          range(now) {
            const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
            return {
              start,
              end: new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7),
            };
          },
        },
        {
          label: "This Month",
          period: "month",
          range(now) {
            return {
              start: new Date(now.getFullYear(), now.getMonth(), 1),
              end: new Date(now.getFullYear(), now.getMonth() + 1, 1),
            };
          },
        },
        {
          label: "This Year",
          period: "year",
          range(now) {
            return {
              start: new Date(now.getFullYear(), 0, 1),
              end: new Date(now.getFullYear() + 1, 0, 1),
            };
          },
        },
        {
          label: "Lifetime",
          period: "lifetime",
          range() {
            return {
              start: new Date(1985, 3, 17, 3, 41, 0, 0),
              end: new Date(2065, 3, 17, 3, 41, 0, 0),
            };
          },
        },
      ];

      const segmentGrids = {
        hour: { rows: 10, cols: 6, segments: 60 },
        day: { rows: 6, cols: 4, segments: 24 },
        week: { rows: 14, cols: 12, segments: 168 },
        year: { rows: 4, cols: 3, segments: 12 },
        lifetime: { rows: 10, cols: 8, segments: 80 },
      };

      const periods = [
        ...pageDefinitions.map((definition) => ({ ...definition, view: "flow" })),
        ...pageDefinitions.map((definition) => ({
          ...definition,
          view: "grid",
          grid: segmentGrids[definition.period],
        })),
      ];

      let activePeriod = 0;
      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let pointerStartX = 0;
      let pointerStartY = 0;
      let pointerStartTime = 0;
      let pointerTracking = false;
      let readoutOffset = 0;
      let lastTapTime = 0;
      let lastTapX = 0;
      let lastTapY = 0;
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;

      function resizeCanvas() {
        width = Math.max(1, Math.round(window.innerWidth));
        height = Math.max(1, Math.round(window.innerHeight));
        pixelRatio = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        context.imageSmoothingEnabled = false;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getProgress(now) {
        const { start, end } = periods[activePeriod].range(now);
        return clamp((now - start) / (end - start), 0, 1);
      }

      function draw(page, now, progress) {
        if (page.view === "grid") {
          drawGridPage(page, now);
          return;
        }

        drawFlowPage(progress);
      }

      function drawFlowPage(progress) {
        const totalPixels = width * height;
        const elapsedPixels = Math.floor(totalPixels * progress);
        const fullRows = Math.floor(elapsedPixels / width);
        const partialPixels = elapsedPixels - fullRows * width;
        const livePixel = Math.min(totalPixels - 1, Math.max(0, elapsedPixels));
        const liveX = livePixel % width;
        const liveY = Math.floor(livePixel / width);

        context.fillStyle = colors.remaining;
        context.fillRect(0, 0, width, height);

        context.fillStyle = colors.elapsed;
        if (fullRows > 0) {
          context.fillRect(0, 0, width, fullRows);
        }
        if (partialPixels > 0 && fullRows < height) {
          context.fillRect(0, fullRows, partialPixels, 1);
        }

        drawLiveMarker(liveX, liveY);
        positionReadout(liveY);
      }

      function drawGridPage(page, now) {
        const grid = getGrid(page, now);
        const segment = getSegment(page, now, grid.segments);
        const xEdges = makeEdges(width, grid.cols);
        const yEdges = makeEdges(height, grid.rows);
        let markerX = 0;
        let markerY = 0;

        context.fillStyle = colors.remaining;
        context.fillRect(0, 0, width, height);

        for (let index = 0; index < grid.segments; index += 1) {
          const rect = getCellRect(index, grid.cols, xEdges, yEdges);
          const fillRange = getCellFillRange(page, index, segment);

          if (fillRange.end <= fillRange.start) continue;

          const marker = fillProgressRangeRect(rect, fillRange.start, fillRange.end);
          if (fillRange.showMarker) {
            markerX = marker.x;
            markerY = marker.y;
          }
        }

        drawGridLines(xEdges, yEdges);
        drawGridLabels(page, now, grid, xEdges, yEdges);
        drawLiveMarker(markerX, markerY);
        positionReadout(markerY);
      }

      function getGrid(page, now) {
        if (page.period !== "month") return page.grid;

        return getMonthGrid(daysInMonth(now));
      }

      function makeEdges(size, count) {
        return Array.from({ length: count + 1 }, (_, index) => Math.round((size * index) / count));
      }

      function getCellRect(index, cols, xEdges, yEdges) {
        const row = Math.floor(index / cols);
        const col = index % cols;

        return {
          x: xEdges[col],
          y: yEdges[row],
          width: Math.max(1, xEdges[col + 1] - xEdges[col]),
          height: Math.max(1, yEdges[row + 1] - yEdges[row]),
        };
      }

      function getCellFillRange(page, index, segment) {
        if (page.period === "lifetime" && index === 0) {
          const birthProgress = getYearProgress(new Date(1985, 3, 17, 3, 41, 0, 0));
          const end = index < segment.index ? 1 : segment.progress;

          return {
            start: birthProgress,
            end: Math.max(birthProgress, end),
            showMarker: index === segment.index,
          };
        }

        if (index < segment.index) {
          return { start: 0, end: 1, showMarker: false };
        }

        if (index === segment.index) {
          return { start: 0, end: segment.progress, showMarker: true };
        }

        return { start: 0, end: 0, showMarker: false };
      }

      function fillProgressRangeRect(rect, startProgress, endProgress) {
        const totalPixels = rect.width * rect.height;
        const startPixel = Math.floor(totalPixels * clamp(startProgress, 0, 1));
        const endPixel = Math.floor(totalPixels * clamp(endProgress, 0, 1));
        const livePixel = Math.min(totalPixels - 1, Math.max(0, endPixel));

        context.fillStyle = colors.elapsed;
        for (let pixel = startPixel; pixel < endPixel; ) {
          const row = Math.floor(pixel / rect.width);
          const col = pixel % rect.width;
          const rowEnd = Math.min(endPixel, (row + 1) * rect.width);

          context.fillRect(rect.x + col, rect.y + row, rowEnd - pixel, 1);
          pixel = rowEnd;
        }

        return {
          x: rect.x + (livePixel % rect.width),
          y: rect.y + Math.floor(livePixel / rect.width),
        };
      }

      function drawGridLines(xEdges, yEdges) {
        context.fillStyle = colors.grid;

        for (let index = 1; index < xEdges.length - 1; index += 1) {
          context.fillRect(xEdges[index], 0, 1, height);
        }

        for (let index = 1; index < yEdges.length - 1; index += 1) {
          context.fillRect(0, yEdges[index], width, 1);
        }
      }

      function drawGridLabels(page, now, grid, xEdges, yEdges) {
        const sampleRect = getCellRect(0, grid.cols, xEdges, yEdges);
        const fontSize = getGridLabelFontSize(page, sampleRect);
        const lineHeight = Math.round(fontSize * 1.18);

        context.fillStyle = colors.gridLabel;
        context.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace`;
        context.textAlign = "center";
        context.textBaseline = "middle";

        for (let index = 0; index < grid.segments; index += 1) {
          const rect = getCellRect(index, grid.cols, xEdges, yEdges);
          const lines = getGridLabelLines(page, index, now);
          const centerX = rect.x + rect.width / 2;
          const centerY = rect.y + rect.height / 2;
          const firstY = centerY - ((lines.length - 1) * lineHeight) / 2;

          for (let lineIndex = 0; lineIndex < lines.length; lineIndex += 1) {
            context.fillText(lines[lineIndex], centerX, firstY + lineIndex * lineHeight);
          }
        }
      }

      function getGridLabelFontSize(page, rect) {
        const scale = page.period === "week" ? 0.25 : 0.16;
        const min = page.period === "week" ? 8 : 6;
        const max = page.period === "week" ? 12 : 11;

        return clamp(Math.floor(Math.min(rect.width, rect.height) * scale), min, max);
      }

      function getGridLabelLines(page, index, now) {
        if (page.period === "week") return [getWeekdayLabel(index), formatHourLabel(index % 24)];
        return [getGridLabel(page, index, now)];
      }

      function getGridLabel(page, index, now) {
        if (page.period === "lifetime") return String(1985 + index);
        if (page.period === "hour") return String(index).padStart(2, "0");
        if (page.period === "day") return formatHourLabel(index);
        if (page.period === "month") return `${getMonthName(now)} ${index + 1}`;
        if (page.period === "year") return getMonthName(new Date(now.getFullYear(), index, 1));
        return String(index + 1);
      }

      function formatHourLabel(hour) {
        const suffix = hour < 12 ? "a" : "p";
        const hour12 = hour % 12 || 12;

        return `${hour12}${suffix}`;
      }

      function getWeekdayLabel(hourIndex) {
        return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][Math.floor(hourIndex / 24)];
      }

      function getSegment(page, now, totalSegments) {
        if (page.period === "month") return getMonthSegment(now);
        if (page.period === "year") return getYearSegment(now);
        if (page.period === "lifetime") return getLifetimeSegment(now);

        const { start, end } = page.range(now);
        return getUniformSegment(now, start, end, totalSegments);
      }

      function getUniformSegment(now, start, end, totalSegments) {
        const totalDuration = end - start;
        const elapsed = clamp(now - start, 0, totalDuration);
        const segmentDuration = totalDuration / totalSegments;
        const rawIndex = Math.floor(elapsed / segmentDuration);
        const index = Math.min(totalSegments - 1, rawIndex);
        const segmentStart = segmentDuration * index;
        const progress = elapsed >= totalDuration ? 1 : (elapsed - segmentStart) / segmentDuration;

        return {
          index,
          progress: clamp(progress, 0, 1),
        };
      }

      function getMonthSegment(now) {
        const totalSegments = daysInMonth(now);
        const index = clamp(now.getDate() - 1, 0, totalSegments - 1);
        const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);

        return {
          index,
          progress: clamp((now - start) / (end - start), 0, 1),
        };
      }

      function getYearSegment(now) {
        const index = now.getMonth();
        const start = new Date(now.getFullYear(), now.getMonth(), 1);
        const end = new Date(now.getFullYear(), now.getMonth() + 1, 1);

        return {
          index,
          progress: clamp((now - start) / (end - start), 0, 1),
        };
      }

      function getLifetimeSegment(now) {
        const startYear = 1985;
        const totalSegments = segmentGrids.lifetime.segments;
        const index = clamp(now.getFullYear() - startYear, 0, totalSegments - 1);

        return {
          index,
          progress: getYearProgress(now),
        };
      }

      function daysInMonth(now) {
        return new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      }

      function getMonthGrid(dayCount) {
        const shapes = {
          28: { rows: 7, cols: 4 },
          29: { rows: 6, cols: 5 },
          30: { rows: 6, cols: 5 },
          31: { rows: 8, cols: 4 },
        };

        return {
          ...shapes[dayCount],
          segments: dayCount,
        };
      }

      function getYearProgress(date) {
        const start = new Date(date.getFullYear(), 0, 1);
        const end = new Date(date.getFullYear() + 1, 0, 1);

        return clamp((date - start) / (end - start), 0, 1);
      }

      function drawLiveMarker(x, y) {
        const outer = 7;
        const inner = 3;
        const halfOuter = Math.floor(outer / 2);
        const halfInner = Math.floor(inner / 2);

        context.fillStyle = colors.liveOutline;
        context.fillRect(
          clamp(x - halfOuter, 0, width - outer),
          clamp(y - halfOuter, 0, height - outer),
          outer,
          outer,
        );

        context.fillStyle = colors.live;
        context.fillRect(
          clamp(x - halfInner, 0, width - inner),
          clamp(y - halfInner, 0, height - inner),
          inner,
          inner,
        );
      }

      function positionReadout(frontierY) {
        const readoutHeight = centerElement.offsetHeight;
        const clearance = 26;
        const viewportHeight = window.innerHeight;
        const naturalTop = (viewportHeight - readoutHeight) / 2;
        const naturalBottom = naturalTop + readoutHeight;
        const collides = frontierY >= naturalTop - clearance && frontierY <= naturalBottom + clearance;

        if (!collides) {
          setReadoutOffset(0);
          return;
        }

        const aboveTop = frontierY - clearance - readoutHeight;
        const belowTop = frontierY + clearance;
        const canFitAbove = aboveTop >= 16;
        const canFitBelow = belowTop + readoutHeight <= viewportHeight - 16;

        let targetTop = naturalTop;
        if (canFitAbove && frontierY >= viewportHeight / 2) {
          targetTop = aboveTop;
        } else if (canFitBelow) {
          targetTop = belowTop;
        } else if (canFitAbove) {
          targetTop = aboveTop;
        }

        setReadoutOffset(Math.round(targetTop - naturalTop));
      }

      function setReadoutOffset(offset) {
        if (offset === readoutOffset) return;
        readoutOffset = offset;
        centerElement.style.setProperty("--readout-offset", `${offset}px`);
      }

      function render() {
        const now = new Date();
        const page = periods[activePeriod];
        const progress = getProgress(now);
        periodElement.textContent = getPageLabel(page, now);
        percentElement.textContent = `${(progress * 100).toFixed(10)}%`;
        draw(page, now, progress);
        requestAnimationFrame(render);
      }

      function getPageLabel(page, now) {
        if (page.period === "hour") return formatClockHourLabel(now);
        if (page.period === "day") return `${getMonthName(now)} ${now.getDate()}`;
        if (page.period === "week") return `${getMonthName(now)} week ${getMonthWeek(now)}`;
        if (page.period === "month") return getMonthName(now);
        if (page.period === "year") return String(now.getFullYear());
        if (page.period === "lifetime") return "Life";
        return page.label;
      }

      function formatClockHourLabel(now) {
        const hour = now.getHours();
        const suffix = hour < 12 ? "AM" : "PM";
        const hour12 = hour % 12 || 12;

        return `${hour12} ${suffix}`;
      }

      function getMonthName(now) {
        return [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ][now.getMonth()];
      }

      function getMonthWeek(now) {
        return Math.floor((now.getDate() - 1) / 7) + 1;
      }

      function showNextPeriod() {
        activePeriod = (activePeriod + 1) % periods.length;
      }

      function showPreviousPeriod() {
        activePeriod = (activePeriod - 1 + periods.length) % periods.length;
      }

      function playHopeAudio() {
        hopeAudio.currentTime = 0;
        hopeAudio.play().catch(() => {});
      }

      function isDoubleTapAt(clientX, clientY) {
        const now = performance.now();
        const deltaTime = now - lastTapTime;
        const deltaX = clientX - lastTapX;
        const deltaY = clientY - lastTapY;
        const distance = Math.hypot(deltaX, deltaY);
        const matches = deltaTime > 0 && deltaTime < 330 && distance < 36;

        lastTapTime = now;
        lastTapX = clientX;
        lastTapY = clientY;

        return matches;
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", resizeCanvas);

      window.addEventListener("pointerdown", (event) => {
        pointerStartX = event.clientX;
        pointerStartY = event.clientY;
        pointerStartTime = performance.now();
        pointerTracking = true;
      });

      window.addEventListener("pointerup", (event) => {
        if (!pointerTracking) return;
        pointerTracking = false;

        const deltaX = event.clientX - pointerStartX;
        const deltaY = event.clientY - pointerStartY;
        const elapsed = performance.now() - pointerStartTime;
        const isSwipe = Math.abs(deltaX) > 52 && Math.abs(deltaX) > Math.abs(deltaY) * 1.35 && elapsed < 700;

        if (event.pointerType !== "touch" && isDoubleTapAt(event.clientX, event.clientY)) {
          event.preventDefault();
          playHopeAudio();
          return;
        }

        if (!isSwipe) return;
        if (deltaX > 0) {
          showPreviousPeriod();
        } else {
          showNextPeriod();
        }
      });

      window.addEventListener(
        "touchstart",
        (event) => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
          touchStartTime = performance.now();
        },
        { passive: true },
      );

      window.addEventListener(
        "touchend",
        (event) => {
          if (event.changedTouches.length !== 1) return;
          const touch = event.changedTouches[0];
          const deltaX = touch.clientX - touchStartX;
          const deltaY = touch.clientY - touchStartY;
          const elapsed = performance.now() - touchStartTime;
          const isTap = Math.hypot(deltaX, deltaY) < 28 && elapsed < 450;

          if (!isTap) return;
          if (!isDoubleTapAt(touch.clientX, touch.clientY)) return;

          event.preventDefault();
          playHopeAudio();
        },
        { passive: false },
      );

      window.addEventListener(
        "touchmove",
        (event) => {
          event.preventDefault();
        },
        { passive: false },
      );

      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") showPreviousPeriod();
        if (event.key === "ArrowLeft") showNextPeriod();
      });

      resizeCanvas();
      render();
    </script>
  </body>
</html>
